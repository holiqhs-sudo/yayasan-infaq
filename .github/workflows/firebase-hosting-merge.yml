name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist
            !dist/**/*.mp4
            !dist/**/*.mov
            !dist/**/*.webm
            !dist/**/*.avi
            !dist/**/*.png
            !dist/**/*.jpg
            !dist/**/*.jpeg
            !dist/**/*.gif
            !dist/**/*.webp
            !dist/**/*.svg
            !dist/**/*.mp3
            !dist/**/*.pdf
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YAYASAN_INFAQ_16434389_3C142 }}
          channelId: live
          projectId: yayasan-infaq-16434389-3c142
